spring:
  application:
    name: rule-ripple-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ruleripple}
    username: ${DB_USER:ruleripple}
    password: ${DB_PASSWORD:ruleripple}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 1MB        # 규정 파일 1개
      max-request-size: 3MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

ruleripple:
  jwt:
    # 시연용 키. 운영에서는 환경변수로 주입 (최소 32바이트)
    secret: ${JWT_SECRET:rule-ripple-demo-secret-key-change-me-please-32b}
    expires-minutes: 480
  internal:
    # business-mcp / agent 가 /internal/** 호출 시 X-Internal-Token 헤더로 보내는 값
    token: ${INTERNAL_TOKEN:rr-internal-dev-token}
    # agent 가 이벤트를 밀어줄 때 사용할 Spring 주소 (docker network 기준)
    callback-base-url: ${CALLBACK_BASE_URL:http://backend:8080}
  agent:
    base-url: ${AGENT_BASE_URL:http://agent:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  queue:
    exchange: rr.jobs
    main-queue: rr.jobs.q
    retry-queue: rr.jobs.retry
    dead-letter-queue: rr.jobs.dlq
    retry-delay-ms: 3000
    max-attempts: 3
    # 시연용: 작업 처리 시 이 확률로 일부러 실패 (0.0 ~ 1.0). 0 이면 항상 성공
    failure-rate: ${JOB_FAILURE_RATE:0.3}
  business-data:
    # 기동 시 비어 있는 products · product_rules · loan_contracts 에 넣을 JSON 폴더. bootRun 은 backend/ 에서 실행된다
    dir: ${BUSINESS_DATA_DIR:../data/business}
  demo:
    # POST /api/demo/reset 허용. 업무 데이터와 작업 기록을 처음 상태로 되돌린다 (시연용)
    reset-enabled: ${DEMO_RESET_ENABLED:true}
