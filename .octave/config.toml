[scripts]
copy = []
setup = "pnpm -C frontend install --frozen-lockfile"

[scripts.run.dev]
command = "pnpm -C frontend dev --port $OCTAVE_PORT --strictPort"

[[scripts.check]]
name = "format"
command = "pnpm -C frontend format:check"
description = "Files are not Prettier-formatted: run `pnpm format` in frontend/."

[[scripts.check]]
name = "lint"
command = "pnpm -C frontend lint"
description = "ESLint found a problem in the frontend code."

[[scripts.check]]
name = "typecheck"
command = "pnpm -C frontend typecheck"
description = "The types do not hold together (vue-tsc)."

[[scripts.check]]
name = "test"
command = "pnpm -C frontend test"
description = "A Vitest test fails: the change broke behaviour a test pins down."

[[scripts.check]]
name = "build"
command = "pnpm -C frontend build"
description = "The production build fails."

[[scripts.check]]
name = "backend"
command = "backend/gradlew -p backend build --console=plain -q"
description = "The backend fails to compile or a JUnit test fails (`./gradlew build` in backend/)."
