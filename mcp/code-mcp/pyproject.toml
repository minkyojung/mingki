[project]
name = "code-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1",
    "httpx>=0.28",
    "pyyaml>=6",
    "pytest>=9.1.1",   # check_patch 샌드박스에서 샘플 레포 테스트를 돌린다
]

[dependency-groups]
dev = ["pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
